name: Build native apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v1.0.0; leave blank for artifacts only'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'windows/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Universal (Apple Silicon + Intel)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Test and build universal app
        run: bash macos/build-macos.sh --universal
      - name: Check both architectures and package app
        run: |
          lipo 'macos/dist/Vocal Grid.app/Contents/MacOS/VocalGrid' -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent 'macos/dist/Vocal Grid.app' 'VocalGrid-macOS-universal.zip'
          shasum -a 256 VocalGrid-macOS-universal.zip > VocalGrid-macOS-universal.zip.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: VocalGrid-macOS-universal
          path: |
            VocalGrid-macOS-universal.zip
            VocalGrid-macOS-universal.zip.sha256
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows native
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        shell: pwsh
        run: |
          ./windows/build.ps1
          ./tests/windows/verify.ps1
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $smokeOutput=Join-Path $PWD 'dist\windows\UiSmoke.exe'
          $appAssembly=Join-Path $PWD 'dist\windows\MidiToVocal.exe'
          $smokeSource=Join-Path $PWD 'tests\windows\UiSmoke.cs'
          & $compiler /nologo ("/out:"+$smokeOutput) ("/reference:"+$appAssembly) /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /reference:System.Drawing.dll $smokeSource
          if($LASTEXITCODE -ne 0){throw 'Smoke check build failed'}
          & ./dist/windows/UiSmoke.exe tests/windows
          if($LASTEXITCODE -ne 0){throw 'Smoke check failed'}
      - uses: actions/upload-artifact@v6
        with:
          name: VocalGrid-Windows
          path: dist/windows/MidiToVocal.exe
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: VocalGrid-macOS-universal
          path: release
      - uses: actions/download-artifact@v6
        with:
          name: VocalGrid-Windows
          path: release
      - name: Create release with tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a tag such as v1.0.0'; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          cd release
          mv MidiToVocal.exe VocalGrid-Windows.exe
          zip -j VocalGrid-Windows.zip VocalGrid-Windows.exe
          sha256sum VocalGrid-Windows.zip VocalGrid-macOS-universal.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Vocal Grid $RELEASE_TAG" \
            --notes-file ../RELEASE_NOTES.md \
            --latest \
            VocalGrid-Windows.zip VocalGrid-macOS-universal.zip SHA256SUMS.txt

